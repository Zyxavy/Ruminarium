services:
  db:
    image: postgres:18
    container_name: journal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password 
      POSTGRES_DB: journal_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    
volumes:
  postgres_data: